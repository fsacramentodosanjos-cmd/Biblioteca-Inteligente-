<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!-- Cabeçalho comum. Uso: <head th:replace="~{fragments/layout :: head('Título da página')}"></head> -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' — Biblioteca Inteligente'">Biblioteca Inteligente</title>
    <script>
        (function () {
            try {
                var tema = localStorage.getItem('bib-tema');
                if (!tema) {
                    tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', tema);
            } catch (e) { /* sem localStorage: usa o tema claro */ }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- Menu lateral. Uso: <aside th:replace="~{fragments/layout :: menu('livros')}"></aside> -->
<aside class="rail" th:fragment="menu(ativo)">
    <a class="rail-marca" th:href="@{/}">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
            <rect x="3" y="7" width="6" height="18" rx="1" fill="currentColor"/>
            <rect x="11" y="3" width="6" height="22" rx="1" fill="currentColor" opacity=".7"/>
            <rect x="19" y="9" width="6" height="16" rx="1" fill="currentColor" opacity=".45"/>
            <rect x="1" y="25" width="26" height="2" rx="1" fill="currentColor"/>
        </svg>
        <span>Biblioteca<br>Inteligente</span>
    </a>
    <nav class="rail-nav" aria-label="Principal">
        <a th:href="@{/}" th:classappend="${ativo == 'inicio'} ? 'ativo'"><i class="bi bi-house-door"></i> Início</a>
        <a th:href="@{/livros}" th:classappend="${ativo == 'livros'} ? 'ativo'"><i class="bi bi-book"></i> Livros</a>
        <a th:href="@{/usuarios}" th:classappend="${ativo == 'usuarios'} ? 'ativo'"><i class="bi bi-people"></i> Usuários</a>
        <a th:href="@{/emprestimos}" th:classappend="${ativo == 'emprestimos'} ? 'ativo'"><i class="bi bi-arrow-left-right"></i> Empréstimos</a>
    </nav>
    <button type="button" class="rail-tema" data-alternar-tema aria-label="Alternar entre tema claro e escuro">
        <i class="bi bi-circle-half"></i> <span>Tema</span>
    </button>
</aside>

<!-- Mensagens de sucesso/erro vindas de redirecionamentos -->
<div th:fragment="mensagens">
    <div class="aviso aviso-ok" role="status" th:if="${sucesso != null}">
        <i class="bi bi-check-circle"></i> <span th:text="${sucesso}">Feito.</span>
    </div>
    <div class="aviso aviso-erro" role="alert" th:if="${erro != null}">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${erro}">Erro.</span>
    </div>
</div>

<!-- Scripts no fim da página -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
