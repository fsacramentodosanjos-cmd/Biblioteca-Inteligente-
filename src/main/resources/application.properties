spring.application.name=BibliotecaInteligente

# Banco de dados (valores de desenvolvimento; em produção use variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:onepiece}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Datas no formato ISO (yyyy-MM-dd) nos formulários e parâmetros
spring.mvc.format.date=iso

# Regras da biblioteca
biblioteca.prazo-padrao-dias=14
biblioteca.limite-emprestimos=3
biblioteca.max-renovacoes=2
biblioteca.multa-por-dia=0.50

# Carga de dados de demonstração (só insere se o banco estiver vazio)
biblioteca.dados-demo=${BIBLIOTECA_DADOS_DEMO:false}
